name: Install component from github

on:
    workflow_dispatch

jobs:
    do-install:
        runs-on: self-hosted
        name: Do the install
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
            - name: Install UV
              uses: astral-sh/setup-uv@v7
            - name: Install Pulumi
              uses: pulumi/actions@v6
              with: 
                pulumi-version: "v3.207.0"
            - name: Run pulumi about
              run: pulumi about
            - name: Run pulumi install
              run: pulumi install